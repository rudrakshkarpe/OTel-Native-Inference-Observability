<svg viewBox="0 0 1240 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="d0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A3D"/><stop offset="0.55" stop-color="#F0407F"/><stop offset="1" stop-color="#9B4DEB"/>
    </linearGradient>
    <marker id="cWhite" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C7CBD1"/>
    </marker>
  </defs>

  <rect width="1240" height="620" rx="16" fill="#0B0C0E"/>
  <rect x="1" y="1" width="1238" height="618" rx="15" fill="none" stroke="#1D1F23"/>

  <text x="40" y="52" fill="#F4F5F7" font-size="25" font-weight="700">The Payoff — one standard, every signal, correlated</text>
  <text x="40" y="80" fill="#8A9099" font-size="14.5">The same incident across three signals on one time axis. A shared trace_id lets you pivot symptom → cause in a click — and answer the question.</text>

  <!-- incident band -->
  <rect x="640" y="112" width="150" height="356" fill="#F4514E" opacity="0.10"/>
  <line x1="640" y1="112" x2="640" y2="468" stroke="#F4514E" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="790" y1="112" x2="790" y2="468" stroke="#F4514E" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="715" y="128" fill="#F4514E" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="1">SATURATION INCIDENT</text>

  <!-- lane 1: scheduler / KV (teal) -->
  <text x="40" y="176" fill="#6B7280" font-size="11.5" font-weight="600" letter-spacing="1.2">SCHEDULER &amp; KV CACHE</text>
  <line x1="40" y1="220" x2="1200" y2="220" stroke="#22252A"/>
  <circle cx="50" cy="188" r="4.5" fill="#2FD4A7"/><text x="64" y="192" fill="#B7BCC4" font-size="12.5">queue depth · KV-cache usage</text>
  <path d="M50,212 H610 Q645,212 668,178 T722,150 Q762,168 792,205 H1200" fill="none" stroke="#2FD4A7" stroke-width="2.5"/>
  <text x="815" y="165" fill="#2FD4A7" font-size="12">KV → 95%, queue backs up</text>

  <!-- lane 2: latency (violet) -->
  <text x="40" y="264" fill="#6B7280" font-size="11.5" font-weight="600" letter-spacing="1.2">REQUEST LATENCY</text>
  <line x1="40" y1="312" x2="1200" y2="312" stroke="#22252A"/>
  <circle cx="50" cy="276" r="4.5" fill="#A78BFA"/><text x="64" y="280" fill="#B7BCC4" font-size="12.5">P99 time-to-first-token</text>
  <path d="M50,304 H630 Q660,304 685,232 T740,214 Q770,250 800,298 H1200" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="815" y="242" fill="#A78BFA" font-size="12">P99 TTFT spikes</text>

  <!-- lane 3: errors (amber/red) -->
  <text x="40" y="356" fill="#6B7280" font-size="11.5" font-weight="600" letter-spacing="1.2">ERRORS</text>
  <line x1="40" y1="404" x2="1200" y2="404" stroke="#22252A"/>
  <circle cx="50" cy="368" r="4.5" fill="#FBBF24"/><text x="64" y="372" fill="#B7BCC4" font-size="12.5">429 "queue full" spans</text>
  <line x1="50" y1="404" x2="648" y2="404" stroke="#3A2E20" stroke-width="2.5"/>
  <rect x="650" y="378" width="6" height="26" rx="2" fill="#F4514E"/>
  <rect x="664" y="384" width="6" height="20" rx="2" fill="#F4514E"/>
  <rect x="678" y="374" width="6" height="30" rx="2" fill="#F4514E"/>
  <rect x="692" y="388" width="6" height="16" rx="2" fill="#F4514E"/>
  <rect x="706" y="380" width="6" height="24" rx="2" fill="#F4514E"/>
  <rect x="720" y="386" width="6" height="18" rx="2" fill="#F4514E"/>
  <rect x="734" y="378" width="6" height="26" rx="2" fill="#F4514E"/>
  <rect x="748" y="390" width="6" height="14" rx="2" fill="#F4514E"/>
  <rect x="762" y="384" width="6" height="20" rx="2" fill="#F4514E"/>
  <line x1="792" y1="404" x2="1200" y2="404" stroke="#3A2E20" stroke-width="2.5"/>
  <text x="815" y="392" fill="#F4514E" font-size="12">429s appear, then recover</text>

  <!-- time axis -->
  <text x="50" y="492" fill="#6B7280" font-size="11.5">14:25</text>
  <text x="708" y="492" fill="#F4514E" font-size="11.5" text-anchor="middle" font-weight="600">14:32</text>
  <text x="1176" y="492" fill="#6B7280" font-size="11.5" text-anchor="end">14:40</text>
  <line x1="50" y1="470" x2="1200" y2="470" stroke="#22252A"/>

  <!-- correlation payoff bar -->
  <rect x="40" y="516" width="1160" height="72" rx="12" fill="#141518" stroke="#262A30"/>
  <rect x="58" y="534" width="150" height="36" rx="8" fill="#1E2024" stroke="#FBBF24"/>
  <text x="133" y="557" fill="#F4D06F" font-size="12.5" text-anchor="middle">429 log line</text>
  <path d="M212,552 H262" fill="none" stroke="#C7CBD1" stroke-width="2" marker-end="url(#cWhite)"/>
  <rect x="266" y="534" width="150" height="36" rx="8" fill="#1E2024" stroke="#A78BFA"/>
  <text x="341" y="557" fill="#C9B8FA" font-size="12.5" text-anchor="middle">its trace</text>
  <path d="M420,552 H470" fill="none" stroke="#C7CBD1" stroke-width="2" marker-end="url(#cWhite)"/>
  <rect x="474" y="534" width="180" height="36" rx="8" fill="#1E2024" stroke="#2FD4A7"/>
  <text x="564" y="557" fill="#8FE9CE" font-size="12.5" text-anchor="middle">metrics for that second</text>
  <text x="686" y="548" fill="#8A9099" font-size="12.5">shared</text>
  <text x="686" y="564" fill="#E6E8EB" font-size="12.5" font-weight="600">trace_id</text>

  <rect x="770" y="528" width="410" height="48" rx="10" fill="#1E2024" stroke="#5B63E6"/>
  <text x="975" y="551" fill="#E6E8EB" font-size="13.5" font-weight="600" text-anchor="middle">Pivot log → trace → metrics on one trace_id</text>
  <text x="975" y="568" fill="#8A9099" font-size="11.5" text-anchor="middle">one OTel pipeline — root cause, not guesswork</text>
</svg>
